plugins { id 'com.android.application' }

android {
    namespace 'uz.sardort.tradingjournal'
    compileSdk 36
    defaultConfig {
        applicationId 'uz.sardort.tradingjournal'
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('TWA_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('TWA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TWA_KEY_ALIAS')
                keyPassword System.getenv('TWA_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
