<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Drawdown Chuquri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#eab308;
    --gold-dim:#a8860a;
    --ink:#eef2f7;
    --ink-dim:#8792a3;
    --panel:#111826;
    --panel-2:#0d1420;
    --danger:#ef4444;
    --ok:#10b981;
    --radius:16px;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    /* --- Tema o'zgaruvchilari (dark = asosiy) --- */
    --bg-app:#05070a;
    --bg-grad-top-a:#05070a;
    --bg-grad-top-b:#14210f;
    --bg-grad-bot-a:#0a0d12;
    --bg-grad-bot-b:#1c2e1a;
    --surface-1:rgba(255,255,255,0.05);
    --surface-1-border:rgba(255,255,255,0.08);
    --hairline:rgba(255,255,255,0.08);
    --hairline-2:rgba(255,255,255,0.14);
    --tile-ring:rgba(255,255,255,0.55);
    --tile-ring-inset:rgba(255,255,255,0.12);
    --overlay-bg:rgba(3,4,7,0.72);
    --modal-stat-bg:rgba(255,255,255,0.04);
    --badge-ink:#05070a;
  }
  [data-theme="light"]{
    --ink:#111827;
    --ink-dim:#5b6472;
    --panel:#ffffff;
    --panel-2:#f3f5f9;
    --bg-app:#eef1f6;
    --bg-grad-top-a:#ffffff;
    --bg-grad-top-b:#d9f5e2;
    --bg-grad-bot-a:#eef1f6;
    --bg-grad-bot-b:#c9edd6;
    --surface-1:rgba(15,23,42,0.045);
    --surface-1-border:rgba(15,23,42,0.10);
    --hairline:rgba(15,23,42,0.12);
    --hairline-2:rgba(15,23,42,0.18);
    --tile-ring:rgba(15,23,42,0.45);
    --tile-ring-inset:rgba(15,23,42,0.10);
    --overlay-bg:rgba(238,241,246,0.78);
    --modal-stat-bg:rgba(15,23,42,0.045);
    --badge-ink:#05070a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--bg-app);
    display:flex;
    justify-content:center;
    align-items:stretch;
    transition:background-color 300ms ease, color 300ms ease;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:background 900ms ease;
  }
  /* ---------- HUD ---------- */
  #hud{
    position:relative;
    z-index:5;
    padding:16px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #hud-top{
    display:flex;
    align-items:center;
    justify-content:flex-end;
  }
  #well-title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:15px;
    letter-spacing:0.2px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .lvl-badge{
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:700;
    color:var(--badge-ink);
    background:var(--gold);
    padding:2px 8px;
    border-radius:20px;
  }
  #theme-toggle{
    width:30px;height:30px;
    border-radius:9px;
    background:var(--surface-1);
    border:1px solid var(--surface-1-border);
    color:var(--ink);
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  #timer-wrap{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 10px;
    border-radius:10px;
    background:var(--surface-1);
    border:1px solid var(--surface-1-border);
  }
  #timer-wrap.warn{ color:var(--danger); border-color:rgba(239,68,68,0.5); background:rgba(239,68,68,0.12);}
  #stat-row{
    display:flex;
    gap:8px;
  }
  .stat-chip{
    flex:1;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:12px;
    padding:8px 10px;
  }
  .stat-chip .label{
    font-size:9.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:700;
    margin-bottom:2px;
  }
  .stat-chip .value{
    font-family:var(--font-mono);
    font-size:15px;
    font-weight:700;
  }
  .stat-chip.streak .value{ color:var(--gold); }
  #flavor{
    font-size:11.5px;
    color:var(--ink-dim);
    line-height:1.5;
    padding:0 2px;
  }
  /* ---------- Well progress rail ---------- */
  #well-rail{
    position:absolute;
    right:8px;
    top:96px;
    bottom:120px;
    width:6px;
    border-radius:6px;
    background:var(--surface-1);
    z-index:4;
    overflow:hidden;
  }
  #well-rail-fill{
    position:absolute;
    bottom:0;left:0;right:0;
    background:linear-gradient(180deg, var(--gold), #fde68a);
    border-radius:6px;
    transition:height 700ms cubic-bezier(.2,.9,.3,1);
  }
  #well-rail-dot{
    position:absolute;
    right:-5px;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px 2px rgba(234,179,8,0.7);
    transition:bottom 700ms cubic-bezier(.2,.9,.3,1);
  }
  /* ---------- Game board ---------- */
  #board-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 8px 8px;
    position:relative;
    z-index:3;
    overflow:hidden;
  }
  #mahjong-board{
    position:relative;
  }
  .tile{
    position:absolute;
    border-radius:7px;
    background:var(--panel);
    border:1.5px solid transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease, background 200ms ease;
  }
  .tile svg{ width:68%; height:80%; pointer-events:none; }
  /* Bosilishi mumkin bo'lgan (erkin) shamlar — atrofida aniq chegara chizig'i bilan ajratiladi.
     Shakl/rang xira qilinmaydi, faqat chegara borligi bosilishini bildiradi. */
  .tile.free{
    border-color:var(--tile-ring);
    box-shadow:0 0 0 1px var(--tile-ring-inset) inset;
  }
  .tile.blocked{
    border-color:transparent;
    cursor:default;
  }
  .tile.selected{
    border-color:var(--gold);
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 0 0 2px rgba(234,179,8,0.4), 0 8px 16px rgba(0,0,0,0.45);
    z-index:999 !important;
  }
  .tile.mismatch{
    animation:shake 300ms ease;
    border-color:var(--danger);
  }
  .tile.matched{
    animation:burn 360ms ease forwards;
    z-index:998 !important;
  }
  .tile.denied{
    animation:denyFlash 380ms ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  @keyframes burn{
    0%{opacity:1;transform:scale(1);}
    60%{opacity:0.6;transform:scale(1.14);filter:brightness(1.9);}
    100%{opacity:0;transform:scale(0.4);}
  }
  @keyframes denyFlash{
    0%{ background:rgba(239,68,68,0.55); border-color:var(--danger); }
    100%{ background:var(--panel); border-color:transparent; }
  }
  /* ---------- Bottom bar ---------- */
  #bottom-note{
    position:relative;
    z-index:5;
    text-align:center;
    font-size:11px;
    color:var(--ink-dim);
    padding:0 24px 18px;
    line-height:1.5;
  }
  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:var(--overlay-bg);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
    z-index:20;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    width:100%;
    max-width:460px;
    max-height:calc(100vh - 32px);
    max-height:calc(100dvh - 32px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--panel-2);
    border:1px solid var(--hairline);
    border-radius:22px;
    padding:22px 20px 26px;
    animation:slideUp 260ms cubic-bezier(.2,.9,.3,1);
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  @keyframes slideUp{ from{transform:translateY(16px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .modal-eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:8px;
  }
  .modal-title{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:800;
    line-height:1.35;
    margin-bottom:16px;
  }
  .opt-btn{
    display:block;
    width:100%;
    text-align:left;
    background:var(--panel);
    border:1.5px solid var(--hairline);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:600;
    padding:12px 14px;
    border-radius:12px;
    margin-bottom:8px;
    cursor:pointer;
    transition:border-color 150ms ease, background 150ms ease;
  }
  .opt-btn.correct{ border-color:var(--ok); background:rgba(16,185,129,0.14); }
  .opt-btn.wrong{ border-color:var(--danger); background:rgba(239,68,68,0.14); }
  .opt-btn:disabled{ cursor:default; }
  .modal-feedback{
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.55;
    margin:10px 0 4px;
    min-height:18px;
  }
  .cta-btn{
    width:100%;
    margin-top:14px;
    background:var(--gold);
    color:var(--badge-ink);
    border:none;
    font-family:var(--font-display);
    font-weight:800;
    font-size:14.5px;
    padding:14px;
    border-radius:14px;
    cursor:pointer;
  }
  .cta-btn.ghost{
    background:transparent;
    border:1.5px solid var(--hairline-2);
    color:var(--ink);
  }
  .modal-stats{
    display:flex;
    gap:8px;
    margin:14px 0 4px;
  }
  .modal-stats .stat-chip{ background:var(--modal-stat-bg); }
  #sim-chart-wrap{
    display:flex;
    justify-content:center;
    margin:4px 0 16px;
    overflow-x:auto;
    padding:6px 0;
  }
  #sim-chart-wrap svg{ height:110px; width:auto; flex-shrink:0; }
  #sim-actions{
    display:flex;
    gap:10px;
  }
  .sim-btn{
    flex:1;
    padding:14px;
    border-radius:12px;
    font-family:var(--font-display);
    font-weight:800;
    font-size:14px;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:transform 120ms ease, opacity 120ms ease;
  }
  .sim-btn.buy{ background:rgba(34,197,94,0.14); color:#22c55e; border:1.5px solid rgba(34,197,94,0.45); }
  .sim-btn.sell{ background:rgba(239,68,68,0.14); color:#ef4444; border:1.5px solid rgba(239,68,68,0.45); }
  .sim-btn:active{ transform:scale(0.97); }
  .sim-btn:disabled{ opacity:0.55; cursor:default; }
  .sim-btn.correct{ box-shadow:0 0 0 2px var(--ok); }
  .sim-btn.wrong{ box-shadow:0 0 0 2px var(--danger); }
</style>
</head>
<body>
<div id="app">
  <div id="game-fullscreen-topbar" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--hairline);position:relative;z-index:20;flex-shrink:0">
    <button id="game-back-btn" onclick="goBackToJurnal()" style="display:flex;align-items:center;gap:6px;background:var(--surface-1);border:1.5px solid var(--surface-1-border);color:var(--ink);font-family:var(--font-body);font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;flex-shrink:0">← Jurnalga qaytish</button>
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <span class="lvl-badge" id="lvl-badge">1/6</span>
      <button id="theme-toggle" onclick="toggleTheme()" title="Temani almashtirish">🌙</button>
      <div id="timer-wrap">⏱ <span id="timer-val">60</span>s</div>
    </div>
  </div>

  <div id="well-rail">
    <div id="well-rail-fill"></div>
    <div id="well-rail-dot"></div>
  </div>

  <div id="hud">
    <div id="stat-row">
      <div class="stat-chip"><div class="label">Ochko</div><div class="value" id="score-val">0</div></div>
      <div class="stat-chip streak"><div class="label">Streak</div><div class="value" id="streak-val">x1</div></div>
      <div class="stat-chip"><div class="label">Shoshilish</div><div class="value" id="miss-val">0</div></div>
    </div>
    <div id="flavor"></div>
    <button id="shuffle-btn" style="display:none;margin-top:2px;align-self:flex-start;background:rgba(234,179,8,0.14);border:1.5px solid rgba(234,179,8,0.5);color:var(--gold);font-family:var(--font-body);font-weight:700;font-size:12px;padding:7px 12px;border-radius:10px;cursor:pointer" onclick="reshuffleRemaining()">🔀 Mos juftlik yo'q — Aralashtirish</button>
  </div>

  <div id="board-wrap">
    <div id="mahjong-board"></div>
  </div>

  <div id="bottom-note">Faqat ustidan yopilmagan (tepasida boshqa sham yo'q) shamlar tegiladi. Bir xil shakl+rangdagi ikkitasini toping.</div>

  <!-- Quiz / natija modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card" id="modal-card"></div>
  </div>

</div>

<script>
/* =========================================================
   SVECHA SHAKLLARI VA RANGLARI
========================================================= */
const SHAPES = ['doji','marubozu','hammer','star','spintop','engulf'];
const SHAPE_LABEL = {
  doji:'Doji', marubozu:'Marubozu', hammer:'Hammer',
  star:'Shooting Star', spintop:'Spinning Top', engulf:'Big Body'
};
const SHAPE_CFG = {
  doji:     {wt:6,  wb:58, bt:30, bb:34, bw:20},
  marubozu: {wt:10, wb:54, bt:10, bb:54, bw:24},
  hammer:   {wt:8,  wb:60, bt:10, bb:22, bw:20},
  star:     {wt:4,  wb:56, bt:42, bb:54, bw:20},
  spintop:  {wt:8,  wb:56, bt:26, bb:38, bw:14},
  engulf:   {wt:16, wb:48, bt:12, bb:52, bw:30}
};
const COLORS = [
  {id:'emerald', hex:'#10b981', name:'Zumrad'},
  {id:'sapphire', hex:'#3b82f6', name:'Sapfir'},
  {id:'amber',   hex:'#f59e0b', name:'Amber'},
  {id:'violet',  hex:'#a855f7', name:'Binafsha'},
  {id:'crimson', hex:'#ef4444', name:'Qizil'},
  {id:'silver',  hex:'#94a3b8', name:'Kumush'}
];

function candleSVG(shape, hex, level){
  const model = MODEL_BY_ID[shape];
  if(model){
    // 2-bosqichda juftlashda ramka (border) rangi hisobga olinmasligi
    // sababli, chalg'itmasligi uchun ramka umuman chizilmaydi — faqat
    // sham ko'rinishi (naqsh) qoladi.
    return renderModelSVG(model, hex, level === 2);
  }
  const c = SHAPE_CFG[shape];
  return `<svg viewBox="0 0 44 64" xmlns="http://www.w3.org/2000/svg">
    <line x1="22" y1="${c.wt}" x2="22" y2="${c.wb}" stroke="${hex}" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/>
    <rect x="${22-c.bw/2}" y="${c.bt}" width="${c.bw}" height="${c.bb-c.bt}" rx="3.5" fill="${hex}"/>
  </svg>`;
}

/* =========================================================
   LIKVIDNOST MODELLARI (2 talik shamlar)
   Rasmdagi ko'rinishga mos: har bir pattern 2 ta svechadan
   iborat — kichik "sweep" sham + katta tasdiqlovchi sham.
   Yashil = bullish tomon, kulrang = bearish tomon. Kuchdan
   (katta farq) zaifgacha (farq kichraygan) darajalanadi.
   Hech qanday nom/izoh ko'rsatilmaydi — faqat sham ko'rinishi
   bo'yicha aynan bir xil juftni topish kerak.
========================================================= */
const LQ_GREEN = '#22c55e';
const LQ_GRAY  = '#ef4444';

const LQ_PAIR_DEFS = [
  {a:{size:1,y:8}, b:{size:3,y:-6}},
  {a:{size:1,y:6}, b:{size:3,y:-4}},
  {a:{size:2,y:6}, b:{size:3,y:-2}},
  {a:{size:2,y:4}, b:{size:2,y:-4}},
  {a:{size:2,y:2}, b:{size:2,y:-2}},
  {a:{size:3,y:2}, b:{size:2,y:-2}},
  {a:{size:3,y:0}, b:{size:1,y:-2}}
];

const CORE_MODELS = [];
LQ_PAIR_DEFS.forEach((def, i)=>{
  // Bearish versiya: kichik yashil "sweep" + katta kulrang tasdiq
  CORE_MODELS.push({id:'lqb'+(i+1), group:'lq', candles:[{dir:'u',...def.a},{dir:'d',...def.b}]});
  // Bullish versiya: kichik kulrang "sweep" + katta yashil tasdiq
  CORE_MODELS.push({id:'lqg'+(i+1), group:'lq', candles:[{dir:'d',...def.a},{dir:'u',...def.b}]});
});
const MODEL_BY_ID = {};
CORE_MODELS.forEach(m=>MODEL_BY_ID[m.id]=m);

// Har bir model uchun "klon": ko'zga o'xshab ko'rinadi, lekin bitta
// svechasi o'zgargan — fonda chalg'ituvchi sifatida chiqadi va faqat
// o'z klon juftlashadi (asosiy faol setga aralashmaydi).
function makeClone(m){
  const idx = Math.floor(m.candles.length/2);
  const cl = m.candles.map((c,i)=> i===idx
    ? {...c, dir:(c.dir==='u'?'d':'u'), size:(c.size===3?1:c.size+1)}
    : {...c});
  return {id:m.id+'_c', group:m.group, candles:cl};
}
const CLONE_MODELS = CORE_MODELS.map(makeClone);
CLONE_MODELS.forEach(m=>MODEL_BY_ID[m.id]=m);

/* ---------------------------------------------------------
   3 TALIK SHAM MODELLARI (3-bosqichdan boshlab tanlanadi)
   Har bir tile ichida 3 ta sham birga chiziladi — 2 talikdan
   ham qiyinroq, chunki solishtirish uchun 3 ta shaklni bir
   vaqtda solishtirish kerak.
--------------------------------------------------------- */
const TRI_DEFS = [
  {a:{size:1,y:8},  b:{size:2,y:2},  c:{size:3,y:-6}},
  {a:{size:2,y:6},  b:{size:1,y:0},  c:{size:3,y:-6}},
  {a:{size:1,y:6},  b:{size:3,y:0},  c:{size:2,y:-6}},
  {a:{size:2,y:8},  b:{size:2,y:2},  c:{size:3,y:-6}},
  {a:{size:3,y:6},  b:{size:1,y:0},  c:{size:2,y:-6}},
  {a:{size:1,y:4},  b:{size:2,y:0},  c:{size:3,y:-8}},
  {a:{size:2,y:4},  b:{size:3,y:-2}, c:{size:1,y:-8}}
];
const CORE_MODELS_3 = [];
TRI_DEFS.forEach((def,i)=>{
  CORE_MODELS_3.push({id:'tri_b'+(i+1), group:'tri', candles:[{dir:'u',...def.a},{dir:'d',...def.b},{dir:'d',...def.c}]});
  CORE_MODELS_3.push({id:'tri_g'+(i+1), group:'tri', candles:[{dir:'d',...def.a},{dir:'u',...def.b},{dir:'u',...def.c}]});
});
CORE_MODELS_3.forEach(m=>MODEL_BY_ID[m.id]=m);
const CLONE_MODELS_3 = CORE_MODELS_3.map(makeClone);
CLONE_MODELS_3.forEach(m=>MODEL_BY_ID[m.id]=m);

function renderModelSVG(model, ringHex, hideRing){
  const n = model.candles.length;
  const W = 20 + n*13, H = 64;
  const slot = (W-8)/n;
  let inner = '';
  model.candles.forEach((cd,i)=>{
    const cx = 8 + slot*i + slot/2;
    const bodyH = {1:12,2:20,3:30}[cd.size];
    const cy = 32 - (cd.y||0);
    const bt = cy - bodyH/2, bb = cy + bodyH/2;
    const pad = {1:5,2:7,3:9}[cd.size];
    const wt = Math.max(3, bt-pad), wb = Math.min(H-3, bb+pad);
    const bw = Math.min(slot*0.6, 12);
    const hex = cd.dir==='u' ? LQ_GREEN : LQ_GRAY;
    inner += `<line x1="${cx}" y1="${wt}" x2="${cx}" y2="${wb}" stroke="${hex}" stroke-width="2" stroke-linecap="round" opacity="0.9"/><rect x="${(cx-bw/2).toFixed(1)}" y="${bt.toFixed(1)}" width="${bw.toFixed(1)}" height="${(bb-bt).toFixed(1)}" rx="2" fill="${hex}"/>`;
  });
  const ring = hideRing ? '' : `<rect x="1.5" y="1.5" width="${W-3}" height="${H-3}" rx="9" fill="none" stroke="${ringHex}" stroke-width="2" opacity="0.55"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${ring}
    ${inner}
  </svg>`;
}

function mirrorSetup(m){
  const flip = d => d==='u' ? 'd' : d==='d' ? 'u' : 'n';
  return {
    id:m.id+'_mir',
    correct: m.correct==='buy' ? 'sell' : 'buy',
    scenario: m.scenario,
    candles: m.candles.map(c=>({dir:flip(c.dir), size:c.size, y:-c.y}))
  };
}

function setupColor(dir){
  return dir==='u' ? SETUP_GREEN : dir==='d' ? SETUP_RED : SETUP_GRAY;

// Entry patternidan OLDINGI trend konteksti (5 ta sham) hosil qiladi —
// foydalanuvchi to'liq rasmni (chiqish yoki tushish harakati) ko'rishi
// uchun. Ikki xil ssenariy:
//  - 'reversal': trend eng cho'qqi/eng pastki nuqtaga yetadi va AYNAN
//    o'sha ekstremumda entry pattern shakllanadi, keyin narx teskari
//    tomonga ketadi (klassik hi/low razvorot).
//  - 'continuation': trend allaqachon bir tomonga ketmoqda; entry
//    pattern esa ekstremumda EMAS, balki kichik pullback/konsolidatsiya
//    davomida o'rtada shakllanadi — signalsiz bir oz teskari yurib,
//    keyin asosiy trend tomonida davom etadi.
// Qaytariladigan qiymatlar model.candles bilan bir xil xom (scale
// qo'llanilmagan) y-birligida bo'ladi.
function buildLeadIn(scenario, correct){
  if(scenario === 'continuation'){
    const dir = correct === 'buy' ? 'u' : 'd';
    const oppDir = dir === 'u' ? 'd' : 'u';
    const peak = dir === 'u' ? 42 : -42;
    return [
      {dir, size:2, y: Math.round(peak*0.40)},
      {dir, size:2, y: Math.round(peak*0.75)},
      {dir, size:3, y: Math.round(peak*1.00)},
      {dir: oppDir, size:1, y: Math.round(peak*0.68)},
      {dir: oppDir, size:1, y: Math.round(peak*0.42)}
    ];
  }
  // 'fu': SFU/AFU (LQ taken) juftligi uchun — faqat 3 ta qisqa trend-
  // konteks sham bilan sving nuqtasiga yetkazadi, keyin FU jufti
  // (2 ta sham) davom etadi. Jami: 3+2 = 5 ta sham, oxirgisi LQ taken.
  if(scenario === 'fu'){
    const dir = correct === 'sell' ? 'u' : 'd';
    const peak = dir === 'u' ? 34 : -34;
    return [
      {dir, size:1, y: Math.round(peak*0.30)},
      {dir, size:2, y: Math.round(peak*0.62)},
      {dir, size:2, y: Math.round(peak*0.92)}
    ];
  }
  // 'reversal': trend eng cho'qqiga qarab bir tekis o'sib boradi
  const dir = correct === 'sell' ? 'u' : 'd';
  const peak = dir === 'u' ? 42 : -42;
  return [
    {dir, size:1, y: Math.round(peak*0.18)},
    {dir, size:2, y: Math.round(peak*0.42)},
    {dir, size:2, y: Math.round(peak*0.64)},
    {dir, size:3, y: Math.round(peak*0.84)},
    {dir, size:3, y: Math.round(peak*1.00)}
  ];
}

// Setapni Hi-Low (sving) konteksti bilan chizadi. SELL uchun sving
// chizig'i yuqorida (supurilgan yuqori), BUY uchun pastda (supurilgan
// quyi) joylashadi. revealed=true bo'lsa, narx haqiqatda qayoqqa
// ketganini ko'rsatuvchi qo'shimcha shamlar qo'shiladi.
function renderSetupSVG(bank, revealed){
  const model = bank.model, scale = bank.scale;
  const leadIn = buildLeadIn(model.scenario || 'reversal', model.correct);
  const leadN = leadIn.length;
  const baseN = model.candles.length;
  const extraN = revealed ? 3 : 0;
  const n = leadN + baseN + extraN;
  const slotBase = 24;
  const W = 30 + n*slotBase, H_MIN = 140;
  const slot = (W-16)/n;

  let minCy = Infinity, maxCy = -Infinity;
  const geo = [];
  let lastCy = 65;

  leadIn.forEach(cd=>{
    const bodyH = ({1:14,2:24,3:36}[cd.size]) * scale;
    const cy = 65 - (cd.y||0)*scale;
    const bt = cy - bodyH/2, bb = cy + bodyH/2;
    const pad = ({1:6,2:9,3:12}[cd.size]) * scale;
    const wt = bt-pad, wb = bb+pad;
    minCy = Math.min(minCy, wt); maxCy = Math.max(maxCy, wb);
    geo.push({bt,bb,wt,wb,dir:cd.dir});
    lastCy = cy;
  });

  // Entry pattern shamlari lead-in tugagan nuqtadan silliq davom etadi
  // (model.candles o'zining nisbiy ichki shaklini saqlab qoladi, faqat
  // umumiy boshlanish nuqtasi lead-in oxiriga bog'lanadi).
  const leadEndY = leadIn.length ? leadIn[leadIn.length-1].y : 0;
  model.candles.forEach(cd=>{
    const bodyH = ({1:14,2:24,3:36}[cd.size]) * scale;
    const cy = 65 - ((cd.y||0)+leadEndY)*scale;
    const bt = cy - bodyH/2, bb = cy + bodyH/2;
    const pad = ({1:6,2:9,3:12}[cd.size]) * scale;
    const wt = bt-pad, wb = bb+pad;
    minCy = Math.min(minCy, wt); maxCy = Math.max(maxCy, wb);
    geo.push({bt,bb,wt,wb,dir:cd.dir});
    lastCy = cy;
  });

  if(revealed){
    const dirSign = model.correct==='buy' ? -1 : 1;
    let cy = lastCy;
    for(let i=0;i<extraN;i++){
      cy += dirSign * (14*scale);
      const bodyH = 16*scale, bt = cy-bodyH/2, bb = cy+bodyH/2, pad = 6*scale;
      const wt = bt-pad, wb = bb+pad;
      minCy = Math.min(minCy, wt); maxCy = Math.max(maxCy, wb);
      geo.push({bt,bb,wt,wb,dir: model.correct==='buy' ? 'u' : 'd'});
    }
  }

  const swingYRaw = model.correct === 'sell' ? minCy - 14 : maxCy + 14;
  minCy = Math.min(minCy, swingYRaw);
  maxCy = Math.max(maxCy, swingYRaw);

  // Grafik pastga (yoki tepaga) haddan tashqari cho'zilib, konteynerdan
  // "kesilib" chiqib ketmasligi uchun butun geometriyani vertikal
  // markazlashtirib, kerak bo'lsa balandlikni ham moslashtiramiz.
  const padY = 14;
  const contentH = maxCy - minCy;
  const H = Math.max(H_MIN, contentH + padY*2);
  const shift = padY - minCy;

  let inner = '';
  geo.forEach((g,i)=>{
    const cx = 8 + slot*i + slot/2;
    const bw = Math.min(slot*0.62, 17);
    const hex = setupColor(g.dir);
    const wt = g.wt + shift, wb = g.wb + shift, bt = g.bt + shift, bb = g.bb + shift;
    inner += `<line x1="${cx.toFixed(1)}" y1="${wt.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${wb.toFixed(1)}" stroke="${hex}" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/><rect x="${(cx-bw/2).toFixed(1)}" y="${bt.toFixed(1)}" width="${bw.toFixed(1)}" height="${(bb-bt).toFixed(1)}" rx="2.5" fill="${hex}"/>`;
  });

  const swingY = swingYRaw + shift;
  const swing = `<line x1="6" y1="${swingY.toFixed(1)}" x2="${W-6}" y2="${swingY.toFixed(1)}" stroke="#eab308" stroke-width="1.6" stroke-dasharray="4,4" opacity="0.75"/>`;

  let divider = '';
  if(revealed){
    const dx = 8 + slot*(leadN+baseN);
    divider = `<line x1="${dx.toFixed(1)}" y1="4" x2="${dx.toFixed(1)}" y2="${H-4}" stroke="#eab308" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${swing}${divider}${inner}</svg>`;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function hexLerp(a,b,t){
  const pa = [1,3,5].map(i=>parseInt(a.substr(i,2),16));
  const pb = [1,3,5].map(i=>parseInt(b.substr(i,2),16));
  const p = pa.map((v,i)=>Math.round(v + (pb[i]-v)*t));
  return '#' + p.map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* ---------------------------------------------------------
   MAHJONG USLUBIDAGI QATLAMLI JOYLASHUV
   Pastki qatlam eng katta va to'liq; har keyingi qatlam
   markazga yaqinroq va kichikroq bo'lib ustiga "g'isht"dek
   qo'yiladi. Sham FAQAT quyidagi ikki shart bajarilsagina
   bosiladi:
   1) uning ustida (aynan bir xil gx,gy da) boshqa tirik sham yo'q
   2) chap yoki o'ng qo'shnisidan kamida bittasi bo'sh
--------------------------------------------------------- */

// Faqat gx,gy,z asosida (haqiqiy o'yin holatidan mustaqil) "ochiqmi"
// tekshiruvi — taxta qurish bosqichida ishlatiladi.
function rawIsFree(list, p){
  const EPS = 0.05;
  const covered = list.some(o => o.alive && o!==p && o.z>p.z &&
    Math.abs(o.gx-p.gx)<EPS && Math.abs(o.gy-p.gy)<EPS);
  if(covered) return false;
  const leftBlocked = list.some(o => o.alive && o.z===p.z &&
    Math.abs(o.gy-p.gy)<EPS && Math.abs(o.gx-(p.gx-1))<EPS);
  const rightBlocked = list.some(o => o.alive && o.z===p.z &&
    Math.abs(o.gy-p.gy)<EPS && Math.abs(o.gx-(p.gx+1))<EPS);
  return !(leftBlocked && rightBlocked);
}

// Taxtani "orqaga qarab archish" (reverse-peel) usulida yechiladigan
// qilib quradi: har bosqichda o'sha vaqtdagi barcha OCHIQ joylardan
// tasodifiy ikkitasini tanlab, ularga navbatdagi combo (juftlik turi)
// biriktiriladi va "olib tashlangan" deb belgilanadi. Shu tariqa
// har bir juftlikning ikkala a'zosi — bir-biridan taxtaning istalgan
// chekkasida bo'lsa ham — go'yo tabiiy o'yin davomida bir vaqtning
// o'zida ochiq bo'ladigan tarzda joylashtiriladi. Natijada taxta
// har doim kamida bitta to'liq yechiladigan ketma-ketlikka ega bo'ladi.
function buildSolvableAssignment(rawLayoutPositions, combos){
  const work = rawLayoutPositions.map(p=>({gx:p.gx, gy:p.gy, z:p.z, alive:true}));
  const order = [];
  let guard = 0;
  let remaining = work.filter(p=>p.alive);
  while(remaining.length > 0 && guard < 6000){
    guard++;
    const free = remaining.filter(p=>rawIsFree(remaining, p));
    if(free.length < 2){
      // Nazariy jihatdan bo'lmasligi kerak (piramida geometriyasi doim
      // kamida 2 ta ochiq joy qoldiradi), lekin ehtiyot chorasi sifatida
      // qolganlarni xavfsiz tarzda ketma-ket qo'shib qo'yamiz.
      order.push(...remaining);
      break;
    }
    shuffle(free);
    const p1 = free[0], p2 = free[1];
    order.push(p1, p2);
    p1.alive = false; p2.alive = false;
    remaining = remaining.filter(p=>p.alive);
  }

  return order.map((p, idx)=>{
    const cb = combos[Math.floor(idx/2)];
    return {gx:p.gx, gy:p.gy, z:p.z, shape:cb.shape, color:cb.color, alive:true};
  });
}

function buildLevel(level){
  // 1-bosqich: 1 talik oddiy shamlar. 2-bosqich: 1 talik tugab,
  // 2 talik likvidnost (sweep+confirm) kartalar boshlanadi.
  // 3-bosqichdan boshlab (va undan keyingi barcha bosqichlarda):
  // 3 talik sham kartalari tanlanadigan bo'ladi.
  const tier = level === 1 ? 1 : (level === 2 ? 2 : 3);
  // Ranglar 1-darajadanoq maksimal xilma-xillikda (ko'proq juftlikka joy qoldirish uchun)
  const numColors = COLORS.length;
  const nLayers   = Math.min(3 + Math.floor((level-1)/2), 5);
  // Ko'proq sham = uzunroq vaqt kerak
  const time      = Math.max(85, 150 - (level-1)*8);

  let combos = [];
  if(tier === 1){
    const numShapes = SHAPES.length;
    for(let s=0;s<numShapes;s++)
      for(let c=0;c<numColors;c++)
        combos.push({shape:SHAPES[s], color:COLORS[c]});
  } else {
    const coreList  = tier === 2 ? CORE_MODELS  : CORE_MODELS_3;
    const cloneList = tier === 2 ? CLONE_MODELS : CLONE_MODELS_3;
    // Faol model-setap to'plami bosqichlar davomida kengayadi
    const numModels = Math.min(6 + (level-2)*2, coreList.length);
    const numClones = level >= 5 ? Math.min(3 + (level-5)*2, cloneList.length) : 0;
    const activeModels = shuffle(coreList.slice()).slice(0, numModels);
    const activeClones = shuffle(cloneList.slice()).slice(0, numClones);
    activeModels.forEach(m=>{ for(let c=0;c<numColors;c++) combos.push({shape:m.id, color:COLORS[c]}); });
    activeClones.forEach(m=>{ combos.push({shape:m.id, color:COLORS[0]}); }); // klonlar fon-chalg'ituvchi, bitta rangda
  }
  const maxPairs = combos.length;
  // Taxta ekranni to'ldirishi uchun juftliklar soni sezilarli oshirildi
  const pairs     = Math.min(30 + (level-1)*5, maxPairs, 50);
  const totalTiles = pairs*2;

  shuffle(combos);
  combos = combos.slice(0, pairs);

  const layout = buildMahjongLayout(totalTiles, nLayers);

  // YECHISH MUMKINLIGINI KAFOLATLASH: shamlarni tasodifiy joylarga
  // sochish o'rniga, taxtani "orqaga qarab archish" (peel) usulida
  // quramiz — go'yo o'yinchi doim o'sha vaqtda OCHIQ turgan ikkita
  // shamni tanlab olib tashlayotgandek. Har safar navbatdagi ochiq
  // juftlikka bitta combo biriktiriladi. Natijada taxta har doim,
  // kamida bitta to'g'ri ketma-ketlik bilan, oxirigacha yechiladigan
  // bo'ladi — "mos juftlik yo'q" holati deyarli chiqmaydi.
  const positions = buildSolvableAssignment(layout.positions, combos);

  deconflictStackedPairs(positions, level);

  return {positions, baseCols:layout.baseCols, baseRows:layout.baseRows, time};
}

// Bitta juftlikning ikkala a'zosi bir xil ustunda (bir xil gx,gy, turli
// qatlam) ustma-ust tushib qolmasligini kafolatlaydi. Aks holda ular hech
// qachon bir vaqtda ochiq bo'la olmaydi (bittasini olish uchun ikkinchisi
// kerak bo'ladi) — hal qilib bo'lmaydigan tugun hosil bo'ladi. Shunday
// holat topilsa, o'sha sham boshqa ustundagi mos kelmaydigan sham bilan
// almashtiriladi, shunda juftlik "uzoqda bo'lsa ham" ikkalasi alohida-
// alohida ochilishi mumkin bo'ladi.
// Ikkita shamning "juftlik" sifatida mos kelish-kelmasligini tekshiradi.
// 2-bosqichda (2 talik sham-kartalar) faqat shakl (naqsh) mos kelsa
// yetarli — karta chegarasining (border) rangi hisobga olinmaydi.
// Boshqa barcha bosqichlarda (shu jumladan 3-bosqich va undan yuqori,
// masalan 4-5 bosqichlar — kerak bo'lsa shu yerga qo'shiladi) avvalgidek
// shakl HAM rang ikkalasi ham mos kelishi shart.
function candlesMatch(a, b, level){
  if(a.shape !== b.shape) return false;
  if(level === 2) return true;
  return a.color.id === b.color.id;
}

function deconflictStackedPairs(positions, level){
  const sameCombo = (a,b)=> candlesMatch(a, b, level);
  let guard = 0;
  let conflict = true;
  while(conflict && guard < 2000){
    guard++;
    conflict = false;
    for(let i=0;i<positions.length && !conflict;i++){
      const a = positions[i];
      for(let j=i+1;j<positions.length;j++){
        const b = positions[j];
        if(a.gx===b.gx && a.gy===b.gy && a.z!==b.z && sameCombo(a,b)){
          // boshqa ustundagi, mos kelmaydigan (na a, na b bilan) shamni topamiz
          const swapTarget = positions.find(o =>
            o!==a && o!==b &&
            !(o.gx===a.gx && o.gy===a.gy) &&
            !sameCombo(o,a)
          );
          if(swapTarget){
            const ts = b.shape, tc = b.color;
            b.shape = swapTarget.shape; b.color = swapTarget.color;
            swapTarget.shape = ts; swapTarget.color = tc;
          }
          conflict = true;
          break;
        }
      }
    }
  }
}

// Qatlamlar uchun geometriya: pastki (asosiy) qatlam KENG qilib
// yasaladi (tor va uzun ustun emas) va klassik mahjong "toshbaqa"
// shaklidagi kabi ikkala chekkasiga 2 tadan ustun ("qanot") qo'shiladi
// — natijada board rasmdagi klassik maджонг ko'rinishiga o'xshaydi.
function buildMahjongLayout(totalTiles, nLayers){
  const WING_PAD = 2; // har ikki chekkaga qo'shiladigan ustunlar soni

  const weightsTable = {
    2:[0.62,0.38],
    3:[0.54,0.30,0.16],
    4:[0.44,0.28,0.18,0.10],
    5:[0.38,0.24,0.18,0.12,0.08]
  };
  let weights = weightsTable[nLayers] || weightsTable[3];
  let counts = weights.map(w=>Math.max(2, Math.round(totalTiles*w)));
  let diff = totalTiles - counts.reduce((a,b)=>a+b,0);
  counts[0] += diff;
  while(counts[0] < 0){ // juda kichik totalTiles holatlarida himoya
    const last = counts.length-1;
    const take = Math.min(2, counts[last]);
    counts[last] -= take; counts[0] += take;
    if(counts[last] <= 0 && counts.length>1) counts.pop();
  }

  // Asosiy (z=0) qatlamdan "qanot" toshlar uchun bir nechtasini ажратамиз
  let wingCount = 0;
  if(counts[0] >= 10){
    wingCount = Math.min(2*WING_PAD, Math.floor(counts[0]*0.10));
    wingCount -= wingCount % 2; // juft son bo'lsin (ikki tomonga teng bo'linadi)
    counts[0] -= wingCount;
  }

  const layerGrids = counts.map((cnt, z)=>{
    const aspect = z===0 ? 1.25 : 1.55; // yuqori qatlamlar endi kengroq maydonga yoyiladi, markazda tiqilib qolmaydi
    const cols = Math.max(2, Math.round(Math.sqrt(cnt*aspect)) + (z>0 ? 1 : 0));
    const rows = Math.max(1, Math.ceil(cnt/cols));
    const cx=(cols-1)/2, cy=(rows-1)/2;
    let cells=[];
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) cells.push({x,y,d:Math.hypot((x-cx)*0.75, y-cy)});
    cells.sort((a,b)=>a.d-b.d);
    cells = cells.slice(0,cnt);
    return {cols, rows, cells};
  });

  const baseColsRaw = layerGrids[0].cols, baseRows = layerGrids[0].rows;
  const baseCols = baseColsRaw + (wingCount>0 ? 2*WING_PAD : 0);

  let positions = [];
  layerGrids.forEach((lg, z)=>{
    const offX = Math.round((baseCols - lg.cols)/2);
    const offY = Math.round((baseRows - lg.rows)/2);
    lg.cells.forEach(c=>{
      positions.push({gx: round1(c.x+offX), gy: round1(c.y+offY), z});
    });
  });

  // Qanot toshlarni (z=0) ikkala chekkaga, o'rta qator(lar)ida joylaymiz
  if(wingCount>0){
    const midRow = Math.floor((baseRows-1)/2);
    const wingRows = [midRow];
    if(baseRows%2===0) wingRows.push(Math.min(baseRows-1, midRow+1));
    let leftLeft = wingCount/2, rightLeft = wingCount/2;
    let ri = 0;
    while(leftLeft>0 || rightLeft>0){
      const ry = wingRows[ri % wingRows.length];
      if(leftLeft>0){ positions.push({gx: round1(WING_PAD - Math.ceil(leftLeft/wingRows.length)), gy: ry, z:0}); leftLeft--; }
      if(rightLeft>0){ positions.push({gx: round1(baseCols-1-WING_PAD + Math.ceil(rightLeft/wingRows.length)), gy: ry, z:0}); rightLeft--; }
      ri++;
      if(ri>20) break; // xavfsizlik uchun cheksiz sikldan himoya
    }
  }

  return {positions, baseCols, baseRows};
}
function round1(v){ return Math.round(v*2)/2; } // 0.5 aniqlikda saqlaymiz

function isFree(p){
  if(!p.alive) return false;
  const EPS = 0.05;
  // Faqat ustidan (yuqori qatlamdan) yopilmagan bo'lsa bosiladi.
  // Yon tomonlar band bo'lsa ham to'sqinlik qilmaydi — shamlar qatlam-
  // qatlam yuqoridan pastga qarab ochiladi (chuqurlikni "archish").
  const covered = state.positions.some(o =>
    o.alive && o!==p && o.z>p.z &&
    Math.abs(o.gx-p.gx)<EPS && Math.abs(o.gy-p.gy)<EPS
  );
  return !covered;
}

function hasAnyMove(){
  const free = state.positions.filter(p=>p.alive && isFree(p));
  for(let i=0;i<free.length;i++){
    for(let j=i+1;j<free.length;j++){
      if(candlesMatch(free[i], free[j], state.level)) return true;
    }
  }
  return false;
}

function checkStuck(){
  const totalLeft = state.positions.filter(p=>p.alive).length;
  const btn = $('shuffle-btn');
  if(totalLeft > 0 && !hasAnyMove()){
    btn.style.display = 'block';
  } else {
    btn.style.display = 'none';
  }
}

// Qolgan (hali yonmagan) shamlarning TURINI aralashtirib qayta
// taqsimlaydi (joylashuv geometriyasi o'zgarmaydi). Kamida bitta harakat
// mavjud bo'lishini kafolatlash uchun ikkita OCHIQ joyni ataylab bir xil
// turga moslaymiz (juftlik sonini buzmaslik uchun mos almashtiruv bilan).
function reshuffleRemaining(){
  const alive = state.positions.filter(p=>p.alive);
  let pool = alive.map(p=>({shape:p.shape, color:p.color}));
  shuffle(pool);
  alive.forEach((p,i)=>{ p.shape = pool[i].shape; p.color = pool[i].color; });

  const free = alive.filter(p=>isFree(p));
  if(free.length>=2){
    const target = free[1];
    const swapCandidate = alive.find(p => p!==free[0] && p!==target && candlesMatch(p, free[0], state.level));
    if(swapCandidate){
      const tmpShape = target.shape, tmpColor = target.color;
      target.shape = swapCandidate.shape; target.color = swapCandidate.color;
      swapCandidate.shape = tmpShape; swapCandidate.color = tmpColor;
    }
  }
  deconflictStackedPairs(alive, state.level);
  state.selectedIdx = null;
  renderBoard();
  checkStuck();
}

/* =========================================================
   RENDER
========================================================= */
const $ = id => document.getElementById(id);

function updateHUD(){
  $('lvl-badge').textContent = `${state.level}/${MAX_LEVEL}`;
  $('score-val').textContent = state.score;
  $('streak-val').textContent = 'x' + state.streak;
  $('miss-val').textContent = state.misses;
  $('flavor').textContent = FLAVOR[state.level-1] || '';

  // Well progress rail
  const frac = (state.level-1) / (MAX_LEVEL-1);
  $('well-rail-fill').style.height = (frac*100) + '%';
  $('well-rail-dot').style.bottom = (frac*100) + '%';

  // Background lightens as you climb
  const topColor = hexLerp(THEME_BG[theme].topA, THEME_BG[theme].topB, frac);
  const bottomColor = hexLerp(THEME_BG[theme].botA, THEME_BG[theme].botB, frac);
  const base = THEME_BG[theme].base;
  $('app').style.background = `radial-gradient(circle at 50% -10%, ${topColor} 0%, ${base} 55%), linear-gradient(180deg, ${base} 0%, ${bottomColor} 100%)`;

  // Bosqichga qarab qoidalar eslatmasi: 1-bosqich oddiy shamlar,
  // 2-bosqichdan 2 talik, 3-bosqichdan 3 talik sham-guruhlari.
  let noteText;
  if(state.level === 1){
    noteText = "Faqat ustidan yopilmagan (tepasida boshqa sham yo'q) shamlar tegiladi. Bir xil shakl+rangdagi ikkitasini toping.";
  } else if(state.level === 2){
    noteText = "Endi 2 talik sham-kartalar chiqadi — har kartada ikkita sham birga. Bir xil ko'rinishdagi ikkitasini toping. O'xshash shakllar chalg'itadi, ammo faqat aynan bir xillari juftlashadi.";
  } else {
    noteText = "Endi 3 talik sham-kartalar chiqadi — har kartada uchta sham birga, solishtirish yanada qiyinlashadi. Faqat aynan bir xil ko'rinishdagi ikkitasini toping.";
  }
  $('bottom-note').textContent = noteText;
}

function computeCellSize(baseCols, baseRows){
  const wrap = $('board-wrap');
  const availW = Math.max(200, wrap.clientWidth - 4);
  const availH = Math.max(200, wrap.clientHeight - 4);
  const aspect = 64/44; // balandlik/kenglik nisbati (svecha shakli bilan bir xil)
  let cellW = availW / (baseCols*0.86 + 0.14); // qoplanish koeffitsiyentini hisobga olamiz
  let cellH = cellW * aspect;
  if(cellH*(baseRows*0.84+0.16) > availH){
    cellH = availH / (baseRows*0.84 + 0.16);
    cellW = cellH/aspect;
  }
  cellW = Math.max(28, Math.min(cellW, 96));
  cellH = cellW*aspect;
  return {cellW, cellH};
}

function renderBoard(){
  const board = $('mahjong-board');
  const {cellW, cellH} = computeCellSize(state.baseCols, state.baseRows);
  const STEP_X = cellW*0.86;
  const STEP_Y = cellH*0.84;
  const RAISE_Z = 11; // har qatlam uchun piksel ko'tarilish (uyum hissi)

  board.style.width  = (state.baseCols*STEP_X + cellW*0.2) + 'px';
  board.style.height = (state.baseRows*STEP_Y + cellH*0.2 + 8) + 'px';
  board.innerHTML = '';

  // pastdan tepaga chizamiz, shunda yuqori qatlamlar pastkilarning
  // ustidan tabiiy tushadi (DOM tartibi ham z-index bilan mos keladi)
  const sorted = state.positions
    .map((p,i)=>({p,i}))
    .filter(x=>x.p.alive)
    .sort((a,b)=> a.p.z - b.p.z);

  sorted.forEach(({p,i})=>{
    const free = isFree(p);
    const tile = document.createElement('div');
    tile.className = 'tile' + (free ? ' free' : ' blocked') + (state.selectedIdx===i ? ' selected' : '');
    tile.style.left = (p.gx*STEP_X) + 'px';
    tile.style.top  = (p.gy*STEP_Y - p.z*RAISE_Z) + 'px';
    tile.style.width = cellW + 'px';
    tile.style.height = cellH + 'px';
    tile.style.zIndex = (p.z*100 + Math.round(p.gy*4));
    tile.dataset.idx = i;
    tile.innerHTML = candleSVG(p.shape, p.color.hex, state.level);
    if(!MODEL_BY_ID[p.shape]) tile.title = `${SHAPE_LABEL[p.shape]} · ${p.color.name}`;
    if(free){
      tile.onclick = () => onCardClick(i);
    } else {
      // Bosilmaydigan karta bosilsa — qizil fon bilan "bo'lmaydi" signalini beramiz
      tile.onclick = () => {
        if(tile.classList.contains('denied')) return;
        tile.classList.add('denied');
        tile.addEventListener('animationend', () => tile.classList.remove('denied'), {once:true});
      };
    }
    board.appendChild(tile);
  });
}

function updateTimerDisplay(){
  $('timer-val').textContent = state.timeLeft;
  const wrap = $('timer-wrap');
  if(state.timeLeft <= 10) wrap.classList.add('warn'); else wrap.classList.remove('warn');
}

/* =========================================================
   O'YIN MANTIG'I
========================================================= */
function startLevel(level){
  const built = buildLevel(level);
  state.level = level;
  state.positions = built.positions;
  state.baseCols = built.baseCols;
  state.baseRows = built.baseRows;
  state.timeLeft = built.time;
  state.selectedIdx = null;
  state.locked = false;
  updateHUD();
  renderBoard();
  checkStuck();
  updateTimerDisplay();
  clearInterval(state.timerId);
  state.timerId = setInterval(tick, 1000);
}

function tick(){
  state.timeLeft--;
  updateTimerDisplay();
  if(state.timeLeft <= 0){
    clearInterval(state.timerId);
    showTimeUpModal();
  }
}

function onCardClick(idx){
  if(state.locked) return;
  const p = state.positions[idx];
  if(!p || !p.alive || !isFree(p)) return;

  if(state.selectedIdx === null){
    state.selectedIdx = idx;
    renderBoard();
    return;
  }
  if(state.selectedIdx === idx){
    state.selectedIdx = null;
    renderBoard();
    return;
  }

  const a = state.positions[state.selectedIdx];
  const b = p;
  const prevSel = state.selectedIdx;

  if(candlesMatch(a, b, state.level)){
    // MATCH
    state.locked = true;
    const tileA = document.querySelector(`.tile[data-idx="${prevSel}"]`);
    const tileB = document.querySelector(`.tile[data-idx="${idx}"]`);
    if(tileA) tileA.classList.add('matched');
    if(tileB) tileB.classList.add('matched');
    state.score += 10 * state.streak;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    setTimeout(()=>{
      a.alive = false; b.alive = false;
      state.selectedIdx = null;
      state.locked = false;
      updateHUD();
      renderBoard();
      if(state.positions.every(x=>!x.alive)){
        clearInterval(state.timerId);
        showSimModal();
      } else {
        checkStuck();
      }
    }, 320);
  } else {
    // MISMATCH
    state.locked = true;
    state.misses++;
    state.streak = 1;
    const tileA = document.querySelector(`.tile[data-idx="${prevSel}"]`);
    const tileB = document.querySelector(`.tile[data-idx="${idx}"]`);
    if(tileA) tileA.classList.add('mismatch');
    if(tileB) tileB.classList.add('mismatch');
    updateHUD();
    setTimeout(()=>{
      state.selectedIdx = null;
      state.locked = false;
      renderBoard();
    }, 320);
  }
}

/* =========================================================
   MODALLAR
========================================================= */
function openModal(html){
  $('modal-card').innerHTML = html;
  $('modal-overlay').classList.add('open');
}
function closeModal(){
  $('modal-overlay').classList.remove('open');
}

function showSimModal(){
  const sim = nextSim();
  const isFinal = state.level >= MAX_LEVEL;
  openModal(`
    <div class="modal-eyebrow">${isFinal ? "Sirtga chiqdingiz" : "Qatlam tozalandi · Narx simulyatori"}</div>
    <div class="modal-title">Grafikni tahlil qiling — narx qayoqqa ketadi?</div>
    <div id="sim-chart-wrap">${renderSetupSVG(sim, false)}</div>
    <div id="sim-actions">
      <button class="sim-btn sell" id="sim-sell">🔻 SELL</button>
      <button class="sim-btn buy" id="sim-buy">🔺 BUY</button>
    </div>
    <div class="modal-feedback" id="sim-feedback"></div>
    <button class="cta-btn" id="sim-continue" style="display:none">${isFinal ? "Yakuniy natija" : "Keyingi qatlamga o'tish"}</button>
  `);
  $('sim-buy').onclick = () => answerSim('buy', sim);
  $('sim-sell').onclick = () => answerSim('sell', sim);
}

function answerSim(choice, sim){
  $('sim-buy').disabled = true;
  $('sim-sell').disabled = true;
  const chosenBtn = choice==='buy' ? $('sim-buy') : $('sim-sell');
  const correctBtn = sim.model.correct==='buy' ? $('sim-buy') : $('sim-sell');
  correctBtn.classList.add('correct');
  if(choice !== sim.model.correct) chosenBtn.classList.add('wrong');

  $('sim-chart-wrap').innerHTML = renderSetupSVG(sim, true);

  const fb = $('sim-feedback');
  if(choice === sim.model.correct){
    state.score += 50;
    fb.textContent = "✅ To'g'ri! Narx aynan shu tomonga ketdi. +50 ochko.";
  } else {
    fb.textContent = "❌ Xato. Narx aslida " + (sim.model.correct==='buy' ? "yuqoriga (BUY)" : "pastga (SELL)") + " ketdi.";
  }
  updateHUD();
  $('sim-continue').style.display = 'block';
  $('sim-continue').onclick = () => {
    closeModal();
    if(state.level >= MAX_LEVEL){
      showFinishModal();
    } else {
      startLevel(state.level+1);
    }
  };
}

function showTimeUpModal(){
  openModal(`
    <div class="modal-eyebrow">Vaqt tugadi</div>
    <div class="modal-title">Chuqurlik yana bir bor sizni sinaydi.</div>
    <div class="modal-feedback">Bu qatlamni qayta urinib ko'ring — shoshilmasdan, bittalab.</div>
    <button class="cta-btn" id="retry-btn">Qayta urinish</button>
    <button class="cta-btn ghost" id="exit-btn" style="margin-top:8px">Chiqish</button>
  `);
  $('retry-btn').onclick = () => { closeModal(); startLevel(state.level); };
  $('exit-btn').onclick = () => { closeModal(); exitGame(); };
}

function exitGame(){
  clearInterval(state.timerId);
  state = {level:1, score:0, streak:1, bestStreak:1, misses:0, timeLeft:0, timerId:null, positions:[], baseCols:6, baseRows:6, selectedIdx:null, locked:false};
  startLevel(1);
}

function showFinishModal(){
  openModal(`
    <div class="modal-eyebrow">Yakuniy natija</div>
    <div class="modal-title">🌅 Siz yorug'likka chiqdingiz!</div>
    <div class="modal-stats">
      <div class="stat-chip"><div class="label">Ochko</div><div class="value">${state.score}</div></div>
      <div class="stat-chip"><div class="label">Eng yaxshi streak</div><div class="value">x${state.bestStreak}</div></div>
      <div class="stat-chip"><div class="label">Shoshilish</div><div class="value">${state.misses}</div></div>
    </div>
    <div class="modal-feedback">Bugungi savdo qoidalaringizni ham xuddi shu sabr bilan bajaring — chuqurlikdan chiqishning yagona yo'li shu.</div>
    <button class="cta-btn" id="restart-btn">Yana chuqurlikka tushish</button>
  `);
  $('restart-btn').onclick = () => {
    closeModal();
    state = {level:1, score:0, streak:1, bestStreak:1, misses:0, timeLeft:0, timerId:null, positions:[], baseCols:6, baseRows:6, selectedIdx:null, locked:false};
    startLevel(1);
  };
}
