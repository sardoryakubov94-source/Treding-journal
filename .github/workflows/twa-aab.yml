name: Android AAB (TWA)

on:
  push:
    paths:
      - "twa/**"
      - ".github/workflows/twa-aab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twa-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36 components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore upload keystore
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::TWA_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "TWA_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          TWA_KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
        run: |
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "versionCode=$VERSION_CODE"
          gradle --no-daemon -p twa bundleRelease
          AAB=twa/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          OUT="$(jarsigner -verify -certs "$AAB" 2>&1 || true)"
          echo "$OUT" | head -n 6
          echo "$OUT" | grep -q "jar verified" || { echo "::error::AAB is not signed"; exit 1; }
          echo "Upload key SHA-256:"
          keytool -list -v -keystore "$TWA_KEYSTORE_PATH" -storepass "$TWA_KEYSTORE_PASSWORD" | grep "SHA256:"

      - uses: actions/upload-artifact@v4
        with:
          name: Trading-Journal-aab
          path: twa/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
